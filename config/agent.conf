<!-- Centralized configuration for the "default" agent group
     (Agents management > Groups > default > Files > agent.conf).
     The agent picks it up and restarts by itself. -->
<agent_config os="Windows">
  <!-- Read Sysmon events -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Real-time FIM on a test folder, with content diffs -->
  <syscheck>
    <directories realtime="yes" check_all="yes" report_changes="yes">C:\Lab\fim</directories>
  </syscheck>
</agent_config>
